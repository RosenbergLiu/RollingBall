<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#070b18" />
    <title>Rolling Ball</title>
    <style>
      /* Shown instantly while the game bundle (with the physics engine) loads. */
      html, body { margin: 0; height: 100%; background: #070b18; }
      #boot { position: fixed; inset: 0; display: grid; place-items: center; background: #070b18; z-index: 10; transition: opacity 0.4s; }
      #boot.done { opacity: 0; pointer-events: none; }
      #boot { font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif; color: #f1f5f9; text-align: center; }
      #boot h1 { margin: 0 0 22px; font-size: 44px; font-weight: 900; letter-spacing: -1px; text-transform: uppercase; }
      #boot p { margin: 18px 0 0; color: #a5b4cc; font-size: 17px; }
      #boot .spin { margin: 0 auto; width: 52px; height: 52px; border-radius: 50%; border: 5px solid rgba(255,255,255,0.15); border-top-color: #60a5fa; animation: boot-spin 0.9s linear infinite; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="boot"><div><h1>Rolling Ball</h1><div class="spin"></div><p>Loading…</p></div></div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
